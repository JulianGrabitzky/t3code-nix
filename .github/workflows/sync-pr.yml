name: Sync release metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Refresh upstream stable and nightly
        env:
          GH_UPDATE_TOKEN: ${{ github.token }}
        run: ./scripts/update.sh all
      - name: Commit refreshed metadata
        run: |
          if git diff --quiet -- versions.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          git commit -m "chore: refresh T3 Code release metadata"
          git push
