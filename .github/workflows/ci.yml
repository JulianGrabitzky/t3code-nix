name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.system }} / ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        system: [x86_64-linux, aarch64-darwin, x86_64-darwin]
        package: [t3code-stable, t3code-nightly]
        include:
          - system: x86_64-linux
            os: ubuntu-latest
          - system: aarch64-darwin
            os: macos-15
          - system: x86_64-darwin
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix build ".#${{ matrix.package }}" --print-build-logs
      - run: test -x ./result/bin/t3code
