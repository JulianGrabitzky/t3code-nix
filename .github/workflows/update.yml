name: Update T3 Code

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Update stable and nightly
        env:
          GH_UPDATE_TOKEN: ${{ github.token }}
        run: ./scripts/update.sh all
      - name: Create update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/t3code-update
          delete-branch: true
          commit-message: "chore: update T3 Code releases"
          title: "chore: update T3 Code releases"
          body: "Updates the pinned stable and nightly T3 Code desktop releases and verifies both Linux builds."
